services:
  postgres:
    image: postgres:16
    container_name: reactsbjwt-postgres
    environment:
      POSTGRES_DB: reactsbjwt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reactsbjwt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: